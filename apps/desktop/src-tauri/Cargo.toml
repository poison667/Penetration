[package]
name = "meridian-desktop"
version = "1.0.0"
description = "Meridian Platform desktop client (Windows + Linux from one codebase)"
authors = ["Meridian"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
